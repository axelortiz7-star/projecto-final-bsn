define({id: "6dd19dc2", inputs: ["d3","pbp","teamIdMap"], outputs: ["playerTeamFromEvents"], body: (d3,pbp,teamIdMap) => {
const playerTeamFromEvents = new Map(
  Array.from(
    d3.rollup(
      pbp
        .filter(d => d.player && d.team_id)
        .map(d => ({
          player: String(d.player).trim(),
          team: teamIdMap[String(d.team_id).trim()]
        }))
        .filter(d => d.player && d.team),
      v => d3.greatest(
        Array.from(d3.rollup(v, g => g.length, d => d.team)),
        d => d[1]
      )?.[0],
      d => d.player
    )
  )
)
return {playerTeamFromEvents};
}});

define({id: "41004ca8", outputs: ["successBool","getPlotCoords"], body: () => {
function successBool(x) {
  return ["true", "1", "made", "yes"].includes(String(x).toLowerCase())
}

function getPlotCoords(d) {
  let rawX = +d.x
  let rawY = +d.y

  let plotX = rawY
  let plotY = rawX

  if (plotY < 50) {
    plotX = 100 - plotX
    plotY = 100 - plotY
  }

  plotY = plotY - 50
  plotY = 50 - plotY

  plotX = plotX / 2
  plotY = plotY * (47 / 50)

  return {plotX, plotY}
}
return {successBool,getPlotCoords};
}});

define({id: "a900d1b9", inputs: ["playerShots","d3"], outputs: ["shotStats"], body: (playerShots,d3) => {
const shotStats = (() => {
  const attempts = playerShots.length
  const makes = d3.sum(playerShots, d => d.made ? 1 : 0)
  const fg = attempts ? makes / attempts : 0

  const paint = playerShots.filter(d =>
    d.plotX >= 17 && d.plotX <= 33 && d.plotY <= 19
  )

  const mid = playerShots.filter(d =>
    d.event_type === "2pt" &&
    !(d.plotX >= 17 && d.plotX <= 33 && d.plotY <= 19)
  )

  const threes = playerShots.filter(d => d.event_type === "3pt")

  return {
    attempts,
    makes,
    fg,
    paintMade: d3.sum(paint, d => d.made ? 1 : 0),
    paintAtt: paint.length,
    midMade: d3.sum(mid, d => d.made ? 1 : 0),
    midAtt: mid.length,
    threeMade: d3.sum(threes, d => d.made ? 1 : 0),
    threeAtt: threes.length
  }
})()
return {shotStats};
}});

define({id: "c45bf9c0", outputs: ["drawCourt"], body: () => {
function drawCourt(g, x, y) {
  const LINE = "#6F7278"

  g.append("rect")
    .attr("x", x(0))
    .attr("y", y(47))
    .attr("width", x(50) - x(0))
    .attr("height", y(0) - y(47))
    .attr("fill", "none")
    .attr("stroke", LINE)
    .attr("stroke-width", 1.4)

  g.append("rect")
    .attr("x", x(17))
    .attr("y", y(19))
    .attr("width", x(33) - x(17))
    .attr("height", y(0) - y(19))
    .attr("fill", "none")
    .attr("stroke", LINE)
    .attr("stroke-width", 1.3)

  g.append("line")
    .attr("x1", x(22))
    .attr("x2", x(28))
    .attr("y1", y(3.2))
    .attr("y2", y(3.2))
    .attr("stroke", "#F2F2F2")
    .attr("stroke-width", 1.5)

  g.append("circle")
    .attr("cx", x(25))
    .attr("cy", y(4))
    .attr("r", 6)
    .attr("fill", "none")
    .attr("stroke", "#F2F2F2")
    .attr("stroke-width", 1.3)

    const hoop = {x: 25, y: 4}
    const threeR = 23.75
    const leftCornerX = 3
    const rightCornerX = 47

    const yCorner = hoop.y + Math.sqrt(
    threeR ** 2 - (hoop.x - leftCornerX) ** 2
    )

    // corner lines
    g.append("line")
    .attr("x1", x(leftCornerX))
    .attr("x2", x(leftCornerX))
    .attr("y1", y(0))
    .attr("y2", y(yCorner))
    .attr("stroke", LINE)
    .attr("stroke-width", 1.4)

    g.append("line")
    .attr("x1", x(rightCornerX))
    .attr("x2", x(rightCornerX))
    .attr("y1", y(0))
    .attr("y2", y(yCorner))
    .attr("stroke", LINE)
    .attr("stroke-width", 1.4)

    // arc
    const arcRadius = x(hoop.x + threeR) - x(hoop.x)

    const arcX1 = x(leftCornerX)
    const arcY1 = y(yCorner)

    const arcX2 = x(rightCornerX)
    const arcY2 = y(yCorner)

    g.append("path")
    .attr(
        "d",
        `M ${arcX1} ${arcY1}
        A ${arcRadius} ${arcRadius} 0 0 1 ${arcX2} ${arcY2}`
    )
    .attr("fill", "none")
    .attr("stroke", LINE)
    .attr("stroke-width", 1.4)
}
return {drawCourt};
}});

define({id: "d6a91ce3", outputs: ["shortPlayerName"], body: () => {
function shortPlayerName(name) {
  const parts = String(name).trim().split(/\s+/)

  if (parts.length <= 1) return name

  const lastName = parts[parts.length - 1]

  return `${parts[0][0]}. ${lastName}`
}
return {shortPlayerName};
}});

define({id: "8b66aafa", inputs: ["html","DASHBOARD_WIDTH","CHART_HEIGHT","L","logoMap","invalidation","chartCard"], outputs: ["renderBSNMap"], body: (html,DASHBOARD_WIDTH,CHART_HEIGHT,L,logoMap,invalidation,chartCard) => {
function renderBSNMap(teamLocations, latestByTeam) {
  const div = html`<div style="
    width: ${DASHBOARD_WIDTH}px;
    height: ${CHART_HEIGHT}px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow: 0 12px 35px rgba(0,0,0,0.18);
  "></div>`;

  const map = L.map(div, {
    zoomControl: true,
    scrollWheelZoom: true
  }).setView([18.2208, -66.1901], 9);

    L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
).addTo(map);

  teamLocations.forEach(d => {
    const logoUrl = logoMap[d.TEAM];
    const stats = latestByTeam.get(d.TEAM);
    const last5Record = stats?.LAST5_RECORD ?? "—";
    const ppgL5 = stats?.PPG_L5 != null ? stats.PPG_L5.toFixed(1) : "—";
    const oppgL5 = stats?.OPPG_L5 != null ? stats.OPPG_L5.toFixed(1) : "—";

    const homeRecord = stats?.HOME_RECORD ?? "—";
    const awayRecord = stats?.AWAY_RECORD ?? "—";
    const offRank = stats?.OFF_RANK ?? "—";
    const defRank = stats?.DEF_RANK ?? "—";
    const netRank = stats?.NET_RANK ?? "—";

    if (!logoUrl) {
      console.warn("Missing logo for:", d.TEAM);
      return;
    }

    const logoIcon = L.divIcon({
      className: "bsn-logo-marker",
      html: `
        <div style="
          width: 58px;
          height: 58px;
          border-radius: 50%;
          background: rgba(255,255,255,0.92);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 6px 18px rgba(0,0,0,0.45);
          border: 2px solid rgba(255,255,255,0.95);
        ">
          <img src="${logoUrl}" style="
            width: 44px;
            height: 44px;
            object-fit: contain;
          ">
        </div>
      `,
      iconSize: [58, 58],
      iconAnchor: [29, 29],
      popupAnchor: [0, -30]
    });

    L.marker([d.LATITUDE, d.LONGITUDE], {
      icon: logoIcon
    })
      .addTo(map)
      .bindPopup(`
    <div style="
        font-family: Inter, system-ui, sans-serif;
        color: #111;
        min-width: 210px;
    ">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">

        <div>
            <div style="font-size:17px; font-weight:900;">${d.TEAM}</div>
            <div style="font-size:13px; color:#555;">${d.CITY}, PR</div>
        </div>
        </div>

        <div style="
        border-top:1px solid rgba(0,0,0,0.12);
        padding-top:10px;
        font-size:13px;
        line-height:1.55;
        ">
        <div><b>Record:</b> ${record}</div>
        <div><b>Local:</b> ${homeRecord}</div>
        <div><b>Visitante:</b> ${awayRecord}</div>
        

        <div style="height:8px;"></div>
        <div style="
        </div>
        margin-top:10px;
        border-top:1px solid rgba(0,0,0,0.08);
        padding-top:10px;
        ">

        <div><b>Ult. 5:</b> ${last5Record}</div>
        <div><b>PPJ U5:</b> ${ppgL5}</div>
        <div><b>OPPJ U5:</b> ${oppgL5}</div>
        <div style="
        </div>
        margin-top:10px;
        border-top:1px solid rgba(0,0,0,0.08);
        padding-top:10px;
        ">
        <div><b>Ofensiva:</b> #${offRank}</div>
        <div><b>Defensa:</b> #${defRank}</div>
        <div><b>Net:</b> #${netRank}</div>
        </div>
        </div>
    `);
    });

  requestAnimationFrame(() => {
    map.invalidateSize();
  });

  invalidation.then(() => map.remove());

  return chartCard(div, "Mapa BSN")
}

define({id: "9ed51cba", inputs: ["teamKey","d3"], outputs: ["buildPointDistribution"], body: (teamKey,d3) => {
function buildPointDistribution(rows, mode = "Anotados") {
  const isScored = mode === "Anotados"

  const lookup = new Map(
    rows.map(d => [`${d.GAME_ID}|${teamKey(d.TEAM)}`, d])
  )

  return Array.from(
    d3.group(rows, d => teamKey(d.TEAM)),
    ([team, teamRows]) => {
      let sourceRows = teamRows

      if (!isScored) {
        sourceRows = teamRows
          .map(d => lookup.get(`${d.GAME_ID}|${teamKey(d.OPPONENT)}`))
          .filter(Boolean)
      }

      const pts = d3.sum(sourceRows, d => +d.PTS || 0)
      const ptsFT = d3.sum(sourceRows, d => +d.FTM || 0)
      const pts3 = d3.sum(sourceRows, d => (+d["3PM"] || 0) * 3)
      const pts2 = Math.max(0, pts - ptsFT - pts3)

      return {
        TEAM: team,
        PTS: pts,
        PTS_2_PCT: pts ? pts2 / pts : 0,
        PTS_FT_PCT: pts ? ptsFT / pts : 0,
        PTS_3_PCT: pts ? pts3 / pts : 0
      }
    }
  ).sort((a, b) => d3.descending(a.PTS_3_PCT, b.PTS_3_PCT))
}
return {buildPointDistribution};
}});

define({id: "9f4d0528", inputs: ["d3","filtered"], outputs: ["latestPerTeam"], body: (d3,filtered) => {
const latestPerTeam = Array.from(
  d3.group(filtered, d => d.TEAM),
  ([team, rows]) => {
    rows = rows.sort((a, b) => d3.ascending(a.TEAM_GAME_NUM, b.TEAM_GAME_NUM))

    const row = rows[rows.length - 1]
    const last5 = rows.slice(-5)

    const l5Wins = d3.sum(last5, d => d.PTS > d.OPP_PTS ? 1 : 0)
    const l5Losses = d3.sum(last5, d => d.PTS < d.OPP_PTS ? 1 : 0)

    const wins = d3.sum(rows, d => d.PTS > d.OPP_PTS ? 1 : 0)
    const losses = d3.sum(rows, d => d.PTS < d.OPP_PTS ? 1 : 0)

    const homeRows = rows.filter(d => d.HOMEAWAY === 1 || d.HOMEAWAY === "1")
    const awayRows = rows.filter(d => d.HOMEAWAY === 0 || d.HOMEAWAY === "0")

    const homeWins = d3.sum(homeRows, d => d.PTS > d.OPP_PTS ? 1 : 0)
    const homeLosses = d3.sum(homeRows, d => d.PTS < d.OPP_PTS ? 1 : 0)

    const awayWins = d3.sum(awayRows, d => d.PTS > d.OPP_PTS ? 1 : 0)
    const awayLosses = d3.sum(awayRows, d => d.PTS < d.OPP_PTS ? 1 : 0)

    return {
      ...row,
      LAST5_RECORD: `${l5Wins}-${l5Losses}`,
      PPG_L5: d3.mean(last5, d => d.PTS),
      OPPG_L5: d3.mean(last5, d => d.OPP_PTS),
      RECORD: `${wins}-${losses}`,
      HOME_RECORD: `${homeWins}-${homeLosses}`,
      AWAY_RECORD: `${awayWins}-${awayLosses}`
    }
  }
)

latestPerTeam.forEach(team => {
  team.OFF_RANK =
    1 + latestPerTeam.filter(d => d.ORTG_L5 > team.ORTG_L5).length

  team.DEF_RANK =
    1 + latestPerTeam.filter(d => d.DRTG_L5 < team.DRTG_L5).length

  team.NET_RANK =
    1 + latestPerTeam.filter(
      d => (d.ORTG_L5 - d.DRTG_L5) >
           (team.ORTG_L5 - team.DRTG_L5)
    ).length
})
return {latestPerTeam};
}});

define({id: "f9757184", inputs: ["teamKey","d3"], outputs: ["buildHomeAwayRating"], body: (teamKey,d3) => {
function buildHomeAwayRating(rows, mode = "Ofensiva") {
  const isOffense = mode === "Ofensiva"

  const withPoss = rows.map(d => ({
    ...d,
    TEAM_CLEAN: teamKey(d.TEAM),
    OPP_CLEAN: teamKey(d.OPPONENT),
    POSS: (+d.FGA || 0) + 0.44 * (+d.FTA || 0) + (+d.TO || 0)
  }))

  const lookup = new Map(
    withPoss.map(d => [`${d.GAME_ID}|${d.TEAM_CLEAN}`, d])
  )

  const rated = withPoss.map(d => {
    const oppRow = lookup.get(`${d.GAME_ID}|${d.OPP_CLEAN}`)

    const ortg = 100 * (+d.PTS || 0) / d.POSS
    const drtg = oppRow
      ? 100 * (+oppRow.PTS || 0) / d.POSS
      : null

    return {
      ...d,
      VALUE: isOffense ? ortg : drtg
    }
  }).filter(d => Number.isFinite(d.VALUE))

  const summary = Array.from(
    d3.group(rated, d => d.TEAM_CLEAN),
    ([team, teamRows]) => {
      const homeRows = teamRows.filter(d => +d.HOMEAWAY === 1)
      const awayRows = teamRows.filter(d => +d.HOMEAWAY === 0)

      const home = d3.mean(homeRows, d => d.VALUE)
      const away = d3.mean(awayRows, d => d.VALUE)

      return {
        TEAM: team,
        HOME: home,
        AWAY: away,
        DIFF: isOffense ? home - away : away - home
      }
    }
  ).filter(d => Number.isFinite(d.HOME) && Number.isFinite(d.AWAY))

  return summary.sort((a, b) => d3.ascending(a.DIFF, b.DIFF))
}
return {buildHomeAwayRating};
}});
